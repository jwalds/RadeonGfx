<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>3D acceleration on Haiku with RadeonGfx</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">3D acceleration on Haiku: RX 560 (Polaris) with RadeonGfx</text>

  <!-- Application process -->
  <rect x="20" y="55" width="480" height="232" rx="10" fill="#e8f0fe" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="40" y="80" font-size="15" font-weight="bold" fill="#1d3a8a">Application (one process per app)</text>
  <rect x="40" y="93" width="440" height="36" rx="6" fill="#ffffff" stroke="#9db3ea"/>
  <text x="56" y="116" font-size="13" fill="#222">Game or app: OpenGL, OpenGL ES or Vulkan</text>
  <rect x="40" y="137" width="440" height="36" rx="6" fill="#ffffff" stroke="#9db3ea"/>
  <text x="56" y="160" font-size="13" fill="#222">Mesa: Zink (OpenGL on Vulkan) and RADV (Vulkan driver)</text>
  <rect x="40" y="181" width="440" height="36" rx="6" fill="#ffffff" stroke="#9db3ea"/>
  <text x="56" y="204" font-size="13" fill="#222">libdrm_amdgpu (Haiku port)</text>
  <rect x="40" y="225" width="440" height="44" rx="6" fill="#ffffff" stroke="#9db3ea"/>
  <text x="56" y="243" font-size="13" fill="#222">radeon_gfx.accelerant: DRM calls become server messages;</text>
  <text x="56" y="260" font-size="13" fill="#222">some are answered from shared memory without a round trip</text>
  <line x1="260" y1="129" x2="260" y2="137" stroke="#9db3ea"/>
  <line x1="260" y1="173" x2="260" y2="181" stroke="#9db3ea"/>
  <line x1="260" y1="217" x2="260" y2="225" stroke="#9db3ea"/>

  <!-- App <-> server -->
  <line x1="260" y1="289" x2="260" y2="333" stroke="#444" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="272" y="308" font-size="12" fill="#444">messages over ports (one link per thread)</text>
  <text x="272" y="323" font-size="12" fill="#444">shared memory: buffers, signaled sync points</text>

  <!-- RadeonGfx server -->
  <rect x="20" y="335" width="480" height="190" rx="10" fill="#e6f4ea" stroke="#3c8d5a" stroke-width="1.5"/>
  <text x="40" y="360" font-size="15" font-weight="bold" fill="#1e5b34">RadeonGfx server (userland, shared by all apps)</text>
  <text x="40" y="387" font-size="13" fill="#222">• DRM interface: buffers, GPU address spaces, submissions, syncobjs</text>
  <text x="40" y="412" font-size="13" fill="#222">• Memory: VRAM and GTT, GART, per-process GPU page tables</text>
  <text x="40" y="437" font-size="13" fill="#222">• Command submission to the graphics ring, fences</text>
  <text x="40" y="462" font-size="13" fill="#222">• Polls the interrupt ring; detects hangs, resets the GPU</text>
  <text x="40" y="487" font-size="13" fill="#222">• Power management (SMU7 DPM), AtomBIOS interpreter</text>
  <text x="40" y="512" font-size="13" fill="#222">• Contexts, reset reporting (as Linux' amdgpu)</text>

  <!-- Server -> hardware -->
  <line x1="260" y1="527" x2="260" y2="583" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="272" y="551" font-size="12" fill="#444">registers and VRAM, mapped into the server:</text>
  <text x="272" y="566" font-size="12" fill="#444">no system call per GPU operation</text>

  <!-- Desktop -->
  <rect x="620" y="55" width="260" height="50" rx="10" fill="#f1e8fb" stroke="#8a5cc4" stroke-width="1.5"/>
  <text x="750" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b2a7a">app_server (desktop)</text>
  <line x1="750" y1="105" x2="750" y2="138" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="620" y="140" width="260" height="56" rx="10" fill="#f1e8fb" stroke="#8a5cc4" stroke-width="1.5"/>
  <text x="750" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b2a7a">radeon_hd.accelerant</text>
  <text x="750" y="184" text-anchor="middle" font-size="13" fill="#222">mode setting, cursor</text>

  <!-- App -> app_server (windows) -->
  <line x1="500" y1="80" x2="618" y2="80" stroke="#444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="559" y="68" text-anchor="middle" font-size="12" fill="#444">windows</text>
  <text x="559" y="98" text-anchor="middle" font-size="11" fill="#666">(Wayland layer)</text>

  <!-- Kernel -->
  <line x1="750" y1="196" x2="750" y2="298" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="760" y="252" font-size="12" fill="#444">display device</text>
  <rect x="620" y="300" width="260" height="150" rx="10" fill="#fdf0e1" stroke="#c47a2c" stroke-width="1.5"/>
  <text x="750" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4512">radeon_hd (kernel driver)</text>
  <text x="636" y="352" font-size="13" fill="#222">display device: used by the</text>
  <text x="636" y="370" font-size="13" fill="#222">accelerant for the screen</text>
  <text x="636" y="397" font-size="13" fill="#222">render device: hands the register,</text>
  <text x="636" y="415" font-size="13" fill="#222">ROM and frame buffer areas</text>
  <text x="636" y="433" font-size="13" fill="#222">to the server</text>

  <!-- Kernel -> server (areas) -->
  <line x1="618" y1="410" x2="502" y2="410" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="398" text-anchor="middle" font-size="12" fill="#444">areas</text>
  <text x="560" y="428" text-anchor="middle" font-size="11" fill="#666">(once, at start)</text>

  <!-- Kernel -> hardware -->
  <line x1="750" y1="450" x2="750" y2="583" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="760" y="520" font-size="12" fill="#444">PCI, display engine</text>

  <!-- Hardware -->
  <rect x="20" y="585" width="860" height="95" rx="10" fill="#efefef" stroke="#777" stroke-width="1.5"/>
  <text x="450" y="611" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Radeon RX 560 (Polaris 11)</text>
  <text x="450" y="636" text-anchor="middle" font-size="13" fill="#222">registers · VRAM 4 GB (256 MB CPU-visible) · graphics engine · SMU (power) · display engine (DCE 11.2)</text>
  <text x="450" y="660" text-anchor="middle" font-size="13" fill="#222">system RAM the GPU reaches through the GART (GTT buffers)</text>
</svg>
